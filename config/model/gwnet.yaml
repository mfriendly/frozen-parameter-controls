# @package _global_

#### Model params #############################################################
model:
  name: gwnet
  hparams:
    hidden_size: 32
    ff_size: 256
    n_layers: 8
    temporal_kernel_size: 2
    spatial_kernel_size: 2
    learned_adjacency: True
    emb_size: 10
    dilation: ${model.hparams.temporal_kernel_size}
    dilation_mod: 2
    norm: batch
    dropout: 0.3
  min_layers: ${min_conv_layers:${window},${model.hparams},1}
  receptive_field: ${tcn_rf:${model.hparams},${model.hparams.n_layers},1}
