# @package _global_
dataset:
  name: airquality
  splitting:
    val_len: 0.1
    test_len: 0.2
  connectivity:
    method: distance
    threshold: 0.1
    include_self: False
  covariates:
    year: False
    day: True
    weekday: True
    mask: True
  adj_layout: csr

window: 24
horizon: 24
stride: 1

scaler:
  method: Standard
  axis: graph
  scale_target: False
